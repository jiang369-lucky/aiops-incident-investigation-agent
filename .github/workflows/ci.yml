name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: incident_agent_test
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: incident_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incident -d incident_agent_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PG_TEST_DATABASE_URL: postgresql://incident:incident_test_password@127.0.0.1:5432/incident_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m pytest -q
