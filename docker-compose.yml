services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: incident_agent
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incident_dev_password}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

  incident-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENT_DATABASE_URL: postgresql://incident:${POSTGRES_PASSWORD:-incident_dev_password}@postgres:5432/incident_agent
      AGENT_SKILLS_PATH: /app/skills
      AGENT_RUNBOOKS_PATH: /app/knowledge/runbooks
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts

volumes:
  postgres_data:
